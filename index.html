<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display LED</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      overflow: hidden;
    }
    #gallery {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: fill;
      display: none;
    }
    .active {
      display: block !important;
    }
  </style>
</head>
<body>

  <div id="gallery"></div>

  <script>
    var API_URL = "https://script.google.com/macros/s/AKfycbxzi6Yh9pRwv7IkCx93tp_hi8_ue-7iZNgt7N3awptc-rPVoeI7no1E1MozeCr0lCvT/exec";

    var urlParams = new URLSearchParams(window.location.search);
    var feed = urlParams.get('feed') || '1';

    fetch(API_URL)
      .then(function(res) { return res.json(); })
      .then(function(imageIds) {
        if (!imageIds || imageIds.length === 0) return;

        // Algoritmi per i 4 Feed
        if (feed === "1") {
          imageIds.sort(function() { return 0.5 - Math.random(); });
        } else if (feed === "2") {
          imageIds.reverse();
        } else if (feed === "3") {
          var evens = imageIds.filter(function(_, idx) { return idx % 2 === 0; });
          var odds = imageIds.filter(function(_, idx) { return idx % 2 !== 0; });
          imageIds = evens.concat(odds);
        } else if (feed === "4") {
          imageIds.sort().reverse().sort(function() { return 0.3 - Math.random(); });
        }

        var gallery = document.getElementById('gallery');
        var loadedSlides = [];

        // Precaricamento sicuro in background
        imageIds.forEach(function(id) {
          var img = new Image();
          var srcUrl = "https://lh3.googleusercontent.com/d/" + id + "=w1080-h1080";
          
          img.onload = function() {
            var slideImg = document.createElement('img');
            slideImg.src = srcUrl;
            slideImg.className = 'slide';
            
            // La prima immagine valida scaricata viene mostrata subito
            if (loadedSlides.length === 0) {
              slideImg.classList.add('active');
            }
            
            gallery.appendChild(slideImg);
            loadedSlides.push(slideImg);
          };

          img.onerror = function() {
            console.warn("Ignorata immagine non caricabile (ID: " + id + ")");
          };

          img.src = srcUrl;
        });

        var current = 0;

        // Rotazione di 60 secondi
        setInterval(function() {
          var slides = gallery.querySelectorAll('.slide');
          if (slides.length > 1) {
            slides[current].classList.remove('active');
            current = (current + 1) % slides.length;
            slides[current].classList.add('active');
          }
        }, 60000);
      })
      .catch(function(err) {
        console.error("Errore recupero lista immagini:", err);
      });
  </script>
</body>
</html>

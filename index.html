<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display LED</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      overflow: hidden;
    }
    #gallery {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: fill; /* Adatta l'immagine all'intera superficie del maxischermo LED */
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
    }
    .active {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div id="gallery"></div>

  <script>
    // Link Apps Script diretto
    var API_URL = "https://script.google.com/macros/s/AKfycbxzi6Yh9pRwv7IkCx93tp_hi8_ue-7iZNgt7N3awptc-rPVoeI7no1E1MozeCr0lCvT/exec";

    var urlParams = new URLSearchParams(window.location.search);
    var feed = urlParams.get('feed') || '1';

    fetch(API_URL)
      .then(function(res) { return res.json(); })
      .then(function(imageIds) {
        if (!imageIds || imageIds.length === 0) return;

        // Gestione ordine
        if (feed === "1") {
          imageIds.sort(function() { return 0.5 - Math.random(); }); // Ordine casuale
        } else if (feed === "2") {
          imageIds.reverse(); // Ordine inverso
        }

        var gallery = document.getElementById('gallery');

        // Creazione tag img nativi caricati direttamente dalla CDN di Google
        imageIds.forEach(function(id, idx) {
          var img = document.createElement('img');
          img.src = "https://lh3.googleusercontent.com/d/" + id;
          img.className = 'slide' + (idx === 0 ? ' active' : '');
          gallery.appendChild(img);
        });

        // Slideshow ciclico ogni 8 secondi
        var current = 0;
        var slides = document.querySelectorAll('.slide');

        if (slides.length > 1) {
          setInterval(function() {
            slides[current].classList.remove('active');
            current = (current + 1) % slides.length;
            slides[current].classList.add('active');
          }, 8000);
        }
      })
      .catch(function(err) {
        console.error("Errore recupero elenco immagini:", err);
      });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display LED</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      overflow: hidden;
    }
    #gallery {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: fill;
      display: none;
    }
    .active {
      display: block;
    }
  </style>
</head>
<body>

  <div id="gallery"></div>

  <script>
    var API_URL = "https://script.google.com/macros/s/AKfycbxzi6Yh9pRwv7IkCx93tp_hi8_ue-7iZNgt7N3awptc-rPVoeI7no1E1MozeCr0lCvT/exec";

    var urlParams = new URLSearchParams(window.location.search);
    var feed = parseInt(urlParams.get('feed')) || 1;

    fetch(API_URL)
      .then(function(res) { return res.json(); })
      .then(function(imageIds) {
        if (!imageIds || imageIds.length === 0) return;

        var total = imageIds.length;
        var gallery = document.getElementById('gallery');

        // Sfalsamento per evitare sovrapposizioni tra i 4 feed
        var offset = Math.floor((total / 4) * (feed - 1));

        var shiftedImageIds = [];
        for (var i = 0; i < total; i++) {
          shiftedImageIds.push(imageIds[(i + offset) % total]);
        }

        var validSlides = [];
        var loadedCount = 0;

        shiftedImageIds.forEach(function(id) {
          var tempImg = new Image();
          tempImg.src = "https://lh3.googleusercontent.com/d/" + id + "=w1080-h1080";
          
          // Aggiunge la foto alla galleria SOLO se il caricamento da Google va a buon fine
          tempImg.onload = function() {
            var img = document.createElement('img');
            img.src = this.src;
            img.className = 'slide';
            
            // Se è la prima foto valida caricata, la rende subito visibile
            if (validSlides.length === 0) {
              img.classList.add('active');
            }
            
            gallery.appendChild(img);
            validSlides.push(img);
          };

          // Se il file non è un'immagine o è corrotto/cancellato, lo ignora completamente
          tempImg.onerror = function() {
            console.warn("Immagine non valida o non trovata ID:", id);
          };
        });

        // Gestione della rotazione ogni 60 secondi basata SOLO sulle immagini valide
        var current = 0;

        setInterval(function() {
          if (validSlides.length > 1) {
            validSlides[current].classList.remove('active');
            current = (current + 1) % validSlides.length;
            validSlides[current].classList.add('active');
          }
        }, 60000); // 1 minuto per foto
      })
      .catch(function(err) {
        console.error("Errore recupero API:", err);
      });
  </script>
</body>
</html>

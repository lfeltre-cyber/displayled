<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display LED</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      overflow: hidden;
    }
    #gallery {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: fill; /* Si adatta perfettamente alle dimensioni della matrice LED */
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
    }
    .active {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div id="gallery"></div>

  <script>
    var FOLDER_ID = "1KoWWPvf4bvecrHlrS2NFdWj9Ylb5p4nj";

    var urlParams = new URLSearchParams(window.location.search);
    var feed = urlParams.get('feed') || '1';

    // Chiamata all'API pubblica della cartella di Google Drive via corsproxy
    var targetUrl = "https://drive.google.com/drive/folders/" + FOLDER_ID;
    var proxyUrl = "https://corsproxy.io/?" + encodeURIComponent(targetUrl);

    fetch(proxyUrl)
      .then(function(res) { return res.text(); })
      .then(function(html) {
        // Estrazione degli ID delle immagini dalla pagina della cartella
        var regex = /https:\/\/lh3\.googleusercontent\.com\/drive-viewer\/[a-zA-Z0-9_-]+/g;
        var matches = html.match(regex) || [];
        
        // Se non trova il nuovo formato CDN, cerca gli ID standard dei file
        var idRegex = /"([a-zA-Z0-9_-]{28,35})"/g;
        var imageIds = [];
        var match;

        while ((match = idRegex.exec(html)) !== null) {
          var id = match[1];
          // Filtra solo gli ID validi evitando chiavi di sistema
          if (id.indexOf("_") === -1 && id.length > 30 && imageIds.indexOf(id) === -1) {
            imageIds.push(id);
          }
        }

        if (imageIds.length === 0) {
          console.log("Nessuna immagine trovata, uso fallback id parser");
          // Fallback con pattern standard
          var altRegex = /\/file\/d\/([a-zA-Z0-9_-]+)/g;
          while ((match = altRegex.exec(html)) !== null) {
            if (imageIds.indexOf(match[1]) === -1) {
              imageIds.push(match[1]);
            }
          }
        }

        // Gestione ordine immagini
        if (feed === "1") {
          imageIds.sort(function() { return 0.5 - Math.random(); });
        } else if (feed === "2") {
          imageIds.reverse();
        }

        var gallery = document.getElementById('gallery');

        imageIds.forEach(function(id, idx) {
          var img = document.createElement('img');
          img.src = "https://lh3.googleusercontent.com/d/" + id;
          img.className = 'slide' + (idx === 0 ? ' active' : '');
          gallery.appendChild(img);
        });

        var current = 0;
        var slides = document.querySelectorAll('.slide');

        if (slides.length > 1) {
          setInterval(function() {
            slides[current].classList.remove('active');
            current = (current + 1) % slides.length;
            slides[current].classList.add('active');
          }, 8000); // 8 secondi a foto
        }
      })
      .catch(function(err) {
        console.error("Errore caricamento:", err);
      });
  </script>
</body>
</html>

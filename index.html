<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display LED</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      overflow: hidden;
    }
    #gallery {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: fill;
      display: none;
    }
    .active {
      display: block;
    }
  </style>
</head>
<body>

  <div id="gallery"></div>

  <script>
    var API_URL = "https://script.google.com/macros/s/AKfycbxzi6Yh9pRwv7IkCx93tp_hi8_ue-7iZNgt7N3awptc-rPVoeI7no1E1MozeCr0lCvT/exec";

    var urlParams = new URLSearchParams(window.location.search);
    var feed = parseInt(urlParams.get('feed')) || 1;

    fetch(API_URL)
      .then(function(res) { return res.json(); })
      .then(function(imageIds) {
        if (!imageIds || imageIds.length === 0) return;

        var total = imageIds.length;
        var gallery = document.getElementById('gallery');

        // Calcola lo sfalsamento fisso per ciascun feed (Feed 1 = 0%, Feed 2 = 25%, Feed 3 = 50%, Feed 4 = 75%)
        var offset = Math.floor((total / 4) * (feed - 1));

        // Riordina l'array partendo dal punto sfalsato
        var shiftedImageIds = [];
        for (var i = 0; i < total; i++) {
          shiftedImageIds.push(imageIds[(i + offset) % total]);
        }

        shiftedImageIds.forEach(function(id, idx) {
          var img = document.createElement('img');
          img.src = "https://lh3.googleusercontent.com/d/" + id + "=w1080-h1080";
          img.className = 'slide' + (idx === 0 ? ' active' : '');
          
          // Gestione errore: rimuove le foto non valide per evitare riquadri neri
          img.onerror = function() {
            if (this.parentNode) this.parentNode.removeChild(this);
          };

          gallery.appendChild(img);
        });

        var current = 0;

        setInterval(function() {
          var slides = document.querySelectorAll('.slide');
          if (slides.length > 1) {
            slides[current].classList.remove('active');
            current = (current + 1) % slides.length;
            slides[current].classList.add('active');
          }
        }, 60000); // 1 minuto per foto
      })
      .catch(function(err) {
        console.error("Errore caricamento foto:", err);
      });
  </script>
</body>
</html>

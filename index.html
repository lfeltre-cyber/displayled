<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display LED</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      overflow: hidden;
    }
    #gallery {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: fill; /* Adatta l'immagine all'intera superficie LED */
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
    }
    .active {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div id="gallery"></div>

  <script>
    // ID della cartella Google Drive
    var FOLDER_ID = "1KoWWPvf4bvecrHlrS2NFdWj9Ylb5p4nj";

    // Lettura del parametro feed dall'URL (?feed=1 o ?feed=2)
    var urlParams = new URLSearchParams(window.location.search);
    var feed = urlParams.get('feed') || '1';

    // URL per la vista incorporata di Google Drive
    var driveUrl = "https://drive.google.com/embeddedfolderview?id=" + FOLDER_ID + "#list";

    // Utilizzo di un proxy CORS aperto per bypassare i blocchi del browser Taurus
    var corsProxy = "https://api.allorigins.win/raw?url=" + encodeURIComponent(driveUrl);

    fetch(corsProxy)
      .then(function(response) {
        if (!response.ok) throw new Error("Errore di rete");
        return response.text();
      })
      .then(function(html) {
        // Estrazione degli ID delle immagini contenute nella cartella
        var regex = /"https:\/\/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)\/view"/g;
        var imageIds = [];
        var match;

        while ((match = regex.exec(html)) !== null) {
          if (imageIds.indexOf(match[1]) === -1) {
            imageIds.push(match[1]);
          }
        }

        if (imageIds.length === 0) {
          console.error("Nessuna immagine trovata nella cartella.");
          return;
        }

        // Gestione dell'ordine in base al feed
        if (feed === "1") {
          imageIds.sort(function() { return 0.5 - Math.random(); }); // Ordine casuale
        } else if (feed === "2") {
          imageIds.reverse(); // Ordine inverso
        }

        var gallery = document.getElementById('gallery');

        // Creazione degli elementi <img> nativi
        imageIds.forEach(function(id, idx) {
          var img = document.createElement('img');
          // Collegamento diretto al server CDN delle immagini Google
          img.src = "https://lh3.googleusercontent.com/d/" + id;
          img.className = 'slide' + (idx === 0 ? ' active' : '');
          gallery.appendChild(img);
        });

        // Avvio dello slideshow ciclico
        var current = 0;
        var slides = document.querySelectorAll('.slide');

        if (slides.length > 1) {
          setInterval(function() {
            slides[current].classList.remove('active');
            current = (current + 1) % slides.length;
            slides[current].classList.add('active');
          }, 8000); // 8 secondi per ogni immagine
        }
      })
      .catch(function(err) {
        console.error("Errore caricamento Drive: ", err);
      });
  </script>
</body>
</html>

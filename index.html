<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display LED</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      overflow: hidden;
    }
    #gallery {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: fill;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
    }
    .active {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div id="gallery"></div>

  <script>
    var FOLDER_ID = "1KoWWPvf4bvecrHlrS2NFdWj9Ylb5p4nj";
    var urlParams = new URLSearchParams(window.location.search);
    var feed = urlParams.get('feed') || '1';

    // Genera l'URL per l'API pubblica di Google Drive
    var rssUrl = "https://drive.google.com/site/drivenotes/rr/drive/folders/" + FOLDER_ID;
    var apiUrl = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent("https://raw.githubusercontent.com/lfeltre-cyber/displayled/main/feed.xml");

    // Usa l'API di fallback per estrarre direttamente i file multimediali
    fetch("https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent("https://drive.google.com/embeddedfolderview?id=" + FOLDER_ID))
      .then(function(res) { return res.json(); })
      .then(function(data) {
        var images = [];
        if (data.items) {
          data.items.forEach(function(item) {
            var match = item.link.match(/\/d\/([a-zA-Z0-9_-]+)/);
            if (match) images.push(match[1]);
          });
        }
        initSlideshow(images);
      })
      .catch(function() {
        // Backup diretto tramite endpoint UC
        fetch("https://lh3.googleusercontent.com/d/" + FOLDER_ID)
          .catch(function() {});
      });

    // Se l'API non risponde, usa la lista dinamica via CDN
    function loadDriveImages() {
      var xhr = new XMLHttpRequest();
      xhr.open("GET", "https://api.allorigins.win/get?url=" + encodeURIComponent("https://drive.google.com/drive/folders/" + FOLDER_ID), true);
      xhr.onload = function() {
        if (xhr.status === 200) {
          var response = JSON.parse(xhr.responseText);
          var html = response.contents;
          var regex = /"https:\/\/lh3\.googleusercontent\.com\/drive-viewer\/([^"]+)"/g;
          var ids = [];
          var match;
          
          var idRegex = /data-id="([a-zA-Z0-9_-]{25,})"/g;
          while ((match = idRegex.exec(html)) !== null) {
            if (ids.indexOf(match[1]) === -1) ids.push(match[1]);
          }
          
          if (ids.length === 0) {
            var fallbackRegex = /([a-zA-Z0-9_-]{33})/g;
            while ((match = fallbackRegex.exec(html)) !== null) {
              if (ids.indexOf(match[1]) === -1 && match[1].indexOf("1KoWWPvf") === -1) {
                ids.push(match[1]);
              }
            }
          }
          initSlideshow(ids);
        }
      };
      xhr.send();
    }

    function initSlideshow(imageIds) {
      if (!imageIds || imageIds.length === 0) return;

      if (feed === "1") {
        imageIds.sort(function() { return 0.5 - Math.random(); });
      } else if (feed === "2") {
        imageIds.reverse();
      }

      var gallery = document.getElementById('gallery');
      gallery.innerHTML = '';

      imageIds.forEach(function(id, idx) {
        var img = document.createElement('img');
        img.src = "https://lh3.googleusercontent.com/d/" + id;
        img.className = 'slide' + (idx === 0 ? ' active' : '');
        gallery.appendChild(img);
      });

      var current = 0;
      var slides = document.querySelectorAll('.slide');

      if (slides.length > 1) {
        setInterval(function() {
          slides[current].classList.remove('active');
          current = (current + 1) % slides.length;
          slides[current].classList.add('active');
        }, 8000);
      }
    }

    loadDriveImages();
  </script>
</body>
</html>

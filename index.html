<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display LED</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      overflow: hidden;
    }
    #gallery {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: fill; /* Adatta l'immagine all'intera superficie della matrice LED */
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
    }
    .active {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div id="gallery"></div>

  <script>
    // 1. Inserisci qui gli ID dei file delle tue foto su Google Drive
    // Puoi recuperarli dal link di condivisione di ogni immagine (es. drive.google.com/file/d/ ID_QUI /view)
    var imageIds = [
      "1KoWWPvf4bvecrHlrS2NFdWj9Ylb5p4nj", // Sostituisci con gli ID reali delle foto
      "1ABC_XYZ_ESEMPIO_ID_2",
      "1ABC_XYZ_ESEMPIO_ID_3"
    ];

    var urlParams = new URLSearchParams(window.location.search);
    var feed = urlParams.get('feed') || '1';

    // Gestione ordine
    if (feed === "1") {
      imageIds.sort(function() { return 0.5 - Math.random(); });
    } else if (feed === "2") {
      imageIds.reverse();
    }

    var gallery = document.getElementById('gallery');

    // Creazione elementi img diretti
    imageIds.forEach(function(id, idx) {
      var img = document.createElement('img');
      img.src = "https://lh3.googleusercontent.com/d/" + id;
      img.className = 'slide' + (idx === 0 ? ' active' : '');
      gallery.appendChild(img);
    });

    // Slideshow ciclico
    var current = 0;
    var slides = document.querySelectorAll('.slide');

    if (slides.length > 1) {
      setInterval(function() {
        slides[current].classList.remove('active');
        current = (current + 1) % slides.length;
        slides[current].classList.add('active');
      }, 8000); // Cambio ogni 8 secondi
    }
  </script>
</body>
</html>

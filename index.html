<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display LED</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      overflow: hidden;
    }
    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: fill; /* Stretch completo sulla matrice LED */
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }
    .active {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div id="gallery"></div>

  <script>
    const FOLDER_ID = "1KoWWPvf4bvecrHlrS2NFdWj9Ylb5p4nj";
    const urlParams = new URLSearchParams(window.location.search);
    const feed = urlParams.get('feed') || '1';

    fetch(`https://drive.google.com/embeddedfolderview?id=${FOLDER_ID}#list`)
      .then(res => res.text())
      .then(html => {
        const idRegex = /"https:\/\/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)\/view"/g;
        let matches = [];
        let match;

        while ((match = idRegex.exec(html)) !== null) {
          if (!matches.includes(match[1])) {
            matches.push(match[1]);
          }
        }

        if (feed === "1") {
          matches.sort(() => 0.5 - Math.random());
        } else if (feed === "2") {
          matches.reverse();
        }

        const selectedIds = matches.slice(0, 20);
        const gallery = document.getElementById('gallery');

        if (selectedIds.length === 0) return;

        selectedIds.forEach((id, idx) => {
          const img = document.createElement('img');
          img.src = `https://lh3.googleusercontent.com/d/${id}`;
          img.className = 'slide' + (idx === 0 ? ' active' : '');
          gallery.appendChild(img);
        });

        let current = 0;
        const slides = document.querySelectorAll('.slide');
        if (slides.length > 1) {
          setInterval(() => {
            slides[current].classList.remove('active');
            current = (current + 1) % slides.length;
            slides[current].classList.add('active');
          }, 8000);
        }
      })
      .catch(err => console.error(err));
  </script>
</body>
</html>
